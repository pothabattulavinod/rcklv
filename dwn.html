<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Protected Download</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    font-family:Arial, sans-serif;
}

.container{
    text-align:center;
}

input{
    width:250px;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
    outline:none;
}

.download-btn{
    padding:14px 30px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.download-btn:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">
    <input type="password" id="password" placeholder="Enter Password">
    <br>
    <button class="download-btn" onclick="downloadImage()">Download</button>
</div>

<script>
function downloadImage() {
    const correctPassword = "12345"; // Change this password
    const enteredPassword = document.getElementById("password").value;

    if (enteredPassword === correctPassword) {
        const link = document.createElement("a");
        link.href = "images/photo.jpg"; // Change to your image path
        link.download = "photo.jpg";
        link.click();
    } else {
        alert("Incorrect password!");
    }
}
</script>

</body>
</html>
